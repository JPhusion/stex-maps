<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Expo Maps: Space Tech Expo Europe 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#1a73e8; --blue-d:#1967d2; --route:#4285f4; --red:#ea4335; --green:#188038;
  --txt:#202124; --sub:#5f6368; --line:#dadce0; --bg:#fff; --chip:#f1f3f4;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;font-family:Roboto,system-ui,-apple-system,sans-serif;color:var(--txt);background:#e8eaed}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit}
svg.i{width:24px;height:24px;fill:currentColor;flex:none}

/* map */
#map{position:fixed;inset:0;overflow:hidden;touch-action:none;background:#e8eaed;cursor:grab}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#world img{display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
#ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.mk{position:absolute;left:0;top:0;pointer-events:none}
.pin{transform:translate(-50%,-100%)}
.dot{width:20px;height:20px;border-radius:50%;background:var(--route);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);transform:translate(-50%,-50%)}
.dot.halo{box-shadow:0 0 0 10px rgba(66,133,244,.18),0 1px 4px rgba(0,0,0,.4)}
.stair{width:26px;height:26px;border-radius:50%;background:#fff;border:2px solid var(--route);display:flex;align-items:center;justify-content:center;transform:translate(-50%,-50%);color:var(--route);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.stair svg{width:16px;height:16px;fill:currentColor}
.hallLbl{position:absolute;transform:translate(-50%,-50%);font-size:12px;font-weight:700;color:#3c4043;letter-spacing:.06em;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;pointer-events:none;white-space:nowrap}

/* top search */
#top{position:fixed;left:0;right:0;top:0;padding:calc(var(--sat) + 10px) 12px 0;pointer-events:none;z-index:20}
.searchbar{pointer-events:auto;display:flex;align-items:center;gap:10px;height:48px;background:#fff;border-radius:24px;box-shadow:0 2px 6px rgba(60,64,67,.3);padding:0 6px 0 16px;max-width:560px}
.searchbar .ph{flex:1;color:var(--sub);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.searchbar .ph.val{color:var(--txt)}
.avatar{width:34px;height:34px;border-radius:50%;background:#7b1fa2;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:500;font-size:14px}
.chips{pointer-events:auto;display:flex;gap:8px;overflow-x:auto;padding:10px 0 6px;scrollbar-width:none;max-width:100%}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;background:#fff;border-radius:16px;box-shadow:0 1px 3px rgba(60,64,67,.3);font-size:14px;font-weight:500;color:#3c4043;white-space:nowrap}
.chip svg{width:18px;height:18px;fill:currentColor}
.chip.on{background:#e8f0fe;color:var(--blue-d)}

/* fabs */
.fab{position:fixed;right:14px;width:48px;height:48px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(60,64,67,.3);display:flex;align-items:center;justify-content:center;color:var(--blue);z-index:15;transition:bottom .25s}
#fabHome{bottom:calc(var(--sab) + 120px)}
#fabFit{bottom:calc(var(--sab) + 178px);color:var(--sub)}

/* bottom sheet */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -2px 10px rgba(60,64,67,.25);transform:translateY(0);transition:transform .25s ease,height .25s ease;max-width:640px;margin:0 auto;display:flex;flex-direction:column;padding-bottom:var(--sab)}
#sheet.dragging{transition:none}
.handle{padding:8px 0 4px;display:flex;justify-content:center;flex:none;touch-action:none;cursor:grab}
.handle i{width:36px;height:4px;border-radius:2px;background:#dadce0;display:block}
#sheetBody{position:relative;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;padding:0 16px 16px}
.pt{font-size:22px;font-weight:400;line-height:28px;margin:2px 0 4px}
.ps{color:var(--sub);font-size:14px;line-height:20px}
.ps b{color:var(--txt);font-weight:500}
.walk{display:inline-flex;align-items:center;gap:4px;color:var(--sub)}
.walk svg{width:16px;height:16px;fill:currentColor}
.acts{display:flex;gap:8px;overflow-x:auto;margin:14px -16px 6px;padding:0 16px 4px;scrollbar-width:none}
.acts::-webkit-scrollbar{display:none}
.btn{flex:none;display:flex;align-items:center;gap:8px;height:36px;padding:0 16px;border-radius:18px;border:1px solid var(--line);color:var(--blue-d);font-size:14px;font-weight:500;text-decoration:none;background:#fff}
.btn svg{width:18px;height:18px;fill:currentColor}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.sect{border-top:1px solid #e8eaed;margin:12px -16px 0;padding:14px 16px 0}
.row{display:flex;gap:16px;align-items:flex-start;padding:8px 0;font-size:14px;line-height:20px}
.row svg{color:var(--blue-d);width:22px;height:22px}
.row a{color:var(--blue-d);text-decoration:none;word-break:break-all}
.about{font-size:14px;line-height:21px;color:#3c4043;white-space:pre-wrap}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:12px;background:var(--chip);border-radius:12px;padding:4px 10px;color:#3c4043}
.mini{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #f1f3f4}
.logo{width:40px;height:40px;border-radius:50%;background:#e8f0fe;color:var(--blue-d);display:flex;align-items:center;justify-content:center;font-weight:500;flex:none;font-size:15px}
.peekTitle{font-size:16px;font-weight:500}
.muted{color:var(--sub);font-size:13px}

/* search panel */
#search{position:fixed;inset:0;background:#fff;z-index:50;display:none;flex-direction:column}
#search.open{display:flex}
.sHead{display:flex;align-items:center;gap:8px;padding:calc(var(--sat) + 8px) 8px 8px;border-bottom:1px solid var(--line)}
.sHead input{flex:1;border:0;outline:0;font-size:17px;height:44px;background:none;min-width:0}
.ib{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--sub);flex:none}
.ib:active{background:#f1f3f4}
#sCtx{padding:8px 16px;font-size:13px;color:var(--sub);border-bottom:1px solid #f1f3f4;display:none}
#results{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.res{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid #f1f3f4;cursor:pointer}
.res:active{background:#f8f9fa}
.res .ric{width:36px;height:36px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;color:var(--sub);flex:none}
.res .ric svg{width:20px;height:20px}
.res .ric{position:relative}
.res .ini{font-size:13px;font-weight:500;color:var(--blue-d)}
.res .ric img{position:absolute;inset:0;width:36px;height:36px;border-radius:50%;object-fit:contain;background:#fff;border:1px solid #e8eaed}
.plogo{width:64px;height:64px;object-fit:contain;border-radius:8px;border:1px solid #e8eaed;background:#fff;flex:none;margin-top:6px}
.res .rt{flex:1;min-width:0}
.res .rn{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .rs{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .rm{font-size:13px;color:var(--sub);text-align:right;flex:none;min-width:44px}
.res .rm b{display:block;color:var(--txt);font-weight:500}
input[type=search]::-webkit-search-cancel-button{display:none}
mark{background:none;color:var(--txt);font-weight:700}
.hdr{padding:14px 16px 6px;font-size:13px;font-weight:500;color:var(--sub);text-transform:uppercase;letter-spacing:.04em}

/* directions top card */
#dir{position:fixed;left:0;right:0;top:0;z-index:25;background:#fff;box-shadow:0 2px 6px rgba(60,64,67,.25);padding:calc(var(--sat) + 8px) 8px 10px;display:none}
#dir.open{display:block}
.dRow{display:flex;align-items:center;gap:4px}
.dFields{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.dField{display:flex;align-items:center;gap:12px;height:40px;border:1px solid var(--line);border-radius:8px;padding:0 12px;font-size:15px;cursor:pointer;min-width:0}
.dField span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dField .fd{width:12px;height:12px;border-radius:50%;border:2px solid var(--sub);flex:none}
.dField .fp{width:12px;height:12px;flex:none;color:var(--red)}
.modes{display:flex;gap:8px;margin:10px 0 0 48px}
.mode{display:flex;align-items:center;gap:6px;height:32px;padding:0 14px;border-radius:16px;background:#e8f0fe;color:var(--blue-d);font-size:14px;font-weight:500}
.mode svg{width:18px;height:18px;fill:currentColor}
.rtTime{font-size:22px;color:var(--green);font-weight:400}
.rtTime span{color:var(--sub);font-size:18px}
.step{display:flex;gap:16px;padding:12px 0;border-bottom:1px solid #f1f3f4;font-size:14px;line-height:20px}
.step svg{width:22px;height:22px;color:var(--sub);flex:none}
.step small{display:block;color:var(--sub);font-size:13px}
#toast{position:fixed;left:50%;bottom:calc(var(--sab) + 140px);transform:translateX(-50%);background:#323232;color:#fff;padding:10px 16px;border-radius:6px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}
#loading{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;padding:12px 18px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.2);font-size:14px;z-index:70}

.nowc{background:#f8f9fa;border-radius:12px;padding:12px;margin:2px 0 14px;cursor:pointer}
.nowh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.avs{width:28px;height:28px;border-radius:50%;background:#7b1fa2;color:#fff;font-size:12px;font-weight:500;display:flex;align-items:center;justify-content:center;flex:none}
.nowb{display:flex;gap:10px;align-items:flex-start;padding:4px 0}
.nowb.nxt{opacity:.85}
.nt{font-size:15px;font-weight:500;line-height:20px}
.nt2{font-size:14px;line-height:19px}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;border:2px solid;flex:none;margin-top:3px}
.schedh{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.dtabs{display:flex;gap:8px;overflow-x:auto;margin:12px -16px 8px;padding:0 16px;scrollbar-width:none}
.dtabs::-webkit-scrollbar{display:none}
.dtab{flex:none;height:32px;padding:0 14px;border-radius:16px;border:1px solid var(--line);font-size:14px;color:#3c4043;white-space:nowrap}
.dtab.on{background:#e8f0fe;border-color:#e8f0fe;color:var(--blue-d);font-weight:500}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--sub);margin:4px 0 6px}
.legend span{display:flex;align-items:center;gap:5px}.legend .sw{margin:0;width:12px;height:12px}
.blk{display:flex;gap:12px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid #f1f3f4;cursor:pointer}
.blk.now{background:#e8f0fe;border-radius:8px}
.blk .bt{width:44px;flex:none;font-size:14px;font-weight:500;line-height:18px}
.blk .bt small{display:block;font-weight:400;color:var(--sub);font-size:12px}
.bx{min-width:0}
.nowtag{font-size:11px;background:var(--blue);color:#fff;border-radius:4px;padding:1px 5px;margin-left:4px;vertical-align:2px}
.withl{display:flex;align-items:center;gap:5px;font-size:13px;color:#7b1fa2;margin-top:2px}.withl svg{width:15px;height:15px;fill:currentColor;flex:none}
.btn.sm{height:32px;padding:0 12px}
#me{border:0;cursor:pointer}

#sheetX{position:absolute;top:4px;right:6px;z-index:2;width:40px;height:40px;background:#f1f3f4;border-radius:50%}
#sheetX svg{width:20px;height:20px}
#sheet.peek #sheetBody{overflow:hidden}
#sbIcon{color:var(--sub)}
.rw{font-size:12px;color:#7b1fa2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.mapall{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid #f1f3f4;flex-wrap:wrap}
.mdot{width:12px;height:12px;border-radius:50%;background:#ea4335;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4);transform:translate(-50%,-50%)}
.team{display:flex;transform:translate(-50%,-130%);gap:2px;pointer-events:auto}
.tm{width:28px;height:28px;border-radius:50%;background:#7b1fa2;color:#fff;font-size:11px;font-weight:700;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);margin-left:-8px;cursor:pointer;pointer-events:auto}
.tm:first-child{margin-left:0}.tm.me{background:#1a73e8}
.blk{position:relative}
.nowline{position:absolute;left:0;right:0;height:2px;background:#ea4335;z-index:1;pointer-events:none;display:block}
.nowline b{position:absolute;left:-2px;top:-4px;width:10px;height:10px;border-radius:50%;background:#ea4335}
.nowgap{position:relative;height:10px}.nowgap .nowline{top:4px}
#leave{position:fixed;left:12px;right:12px;z-index:22;display:none;align-items:center;gap:8px;background:#d93025;color:#fff;border-radius:12px;padding:10px 8px 10px 14px;box-shadow:0 2px 8px rgba(0,0,0,.3);max-width:560px;cursor:pointer}
#leave .lv{flex:1;min-width:0}.lvt{font-size:15px;line-height:20px}.lvs{font-size:13px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvx{color:#fff;width:32px;height:32px;font-size:16px;flex:none}

.smk{color:#f9ab00;font-size:18px;line-height:18px;transform:translate(-50%,-50%);text-shadow:0 0 2px #fff,0 0 2px #fff,0 1px 3px rgba(0,0,0,.4)}
.rstar{color:#f9ab00;margin-right:4px}

#fabCompass{bottom:calc(var(--sab) + 236px)}#fabCompass.on{background:#e8f0fe;box-shadow:0 0 0 2px var(--blue),0 2px 6px rgba(60,64,67,.3)}
#needle{transition:transform .15s linear}
#map{--crot:0deg}
.mk>*{rotate:var(--crot)}

.scanbox{display:flex;gap:12px;align-items:center;background:#f8f9fa;border-radius:12px;padding:10px;margin-top:8px}
.scanbox img{width:72px;border-radius:6px;flex:none}
.scantxt{margin-top:12px;font-size:13px;color:var(--sub)}
.scantxt pre{white-space:pre-wrap;font-family:inherit;background:#f8f9fa;border-radius:8px;padding:8px;color:#3c4043;max-height:160px;overflow:auto}

.meetl{display:flex;align-items:flex-start;gap:5px;font-size:13px;color:#1967d2;margin-top:2px;line-height:17px}.meetl svg{width:15px;height:15px;fill:currentColor;flex:none;margin-top:1px}
.meetl .mt{color:var(--sub)}.meetl i{color:var(--sub);font-style:normal}
.meetbox{background:#e8f0fe;border-radius:10px;padding:8px 10px;margin-top:8px}.meetbox .meetl{font-size:14px;line-height:20px}

.rp{display:flex;align-items:center;gap:4px;font-size:12px;color:#188038;font-weight:500;margin-top:2px;white-space:nowrap;overflow:hidden}.rp span{overflow:hidden;text-overflow:ellipsis}.rp svg{width:14px;height:14px;fill:currentColor;flex:none}.rp.past{color:var(--sub);font-weight:400}
.plan{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid #f1f3f4}.plan.past{opacity:.55}
.plan .pw{width:46px;flex:none;font-size:12px;color:var(--sub);line-height:16px}.plan .pw b{display:block;color:var(--txt);font-size:14px}

a.li{color:inherit;text-decoration:underline;text-decoration-color:rgba(25,103,210,.35);text-underline-offset:2px}
.muted a.li{color:#1967d2}
#lbl{position:absolute;left:0;top:0;pointer-events:none}
body{position:fixed;inset:0;width:100%}
</style>
</head>
<body>
<div id="map"><div id="world"><img id="mapimg" src="map.webp" width="5360" height="2480" alt="Floor plan of Halls 1 to 7"></div>
<canvas id="lbl"></canvas><svg id="ov"><g id="ovBooth"></g><g id="ovRoute"></g></svg><div id="mks"></div></div>

<div id="top">
  <div class="searchbar" id="sbar">
    <button class="ib" id="sbIcon" style="width:32px;height:32px;margin-left:-6px" aria-label="Back"><svg class="i" viewBox="0 0 24 24" style="color:var(--sub)"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></button>
    <div class="ph" id="sbarTxt">Search exhibitors or booths</div>
    <button class="avatar" id="me" title="Choose who you are" aria-label="Choose who you are">?</button>
  </div>
  <div class="chips" id="chips"></div>
</div>

<button class="fab" id="fabCompass" aria-label="Turn the map to face the way you are walking"><svg id="needle" viewBox="0 0 24 24" width="26" height="26"><path d="M12 2 8 12h8z" fill="#ea4335"/><path d="M12 22 8 12h8z" fill="#9aa0a6"/><text x="12" y="10.5" text-anchor="middle" font-size="5" font-weight="700" fill="#fff">N</text></svg></button>
<button class="fab" id="fabFit" aria-label="Show whole floor"><svg class="i" viewBox="0 0 24 24"><path d="M3 5v4h2V5h4V3H5c-1.1 0-2 .9-2 2zm2 10H3v4c0 1.1.9 2 2 2h4v-2H5v-4zm14 4h-4v2h4c1.1 0 2-.9 2-2v-4h-2v4zm0-16h-4v2h4v4h2V5c0-1.1-.9-2-2-2z"/></svg></button>
<button class="fab" id="fabHome" aria-label="Go to start"><svg class="i" viewBox="0 0 24 24"><path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0 0 13 3.06V1h-2v2.06A8.994 8.994 0 0 0 3.06 11H1v2h2.06A8.994 8.994 0 0 0 11 20.94V23h2v-2.06A8.994 8.994 0 0 0 20.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg></button>

<div id="dir">
  <div class="dRow">
    <button class="ib" id="dirBack" aria-label="Back"><svg class="i" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
    <div class="dFields">
      <div class="dField" id="fFrom"><i class="fd"></i><span id="fFromT">Choose start</span></div>
      <div class="dField" id="fTo"><svg class="fp" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 0 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg><span id="fToT">Choose destination</span></div>
    </div>
    <button class="ib" id="swap" aria-label="Swap start and destination"><svg class="i" viewBox="0 0 24 24"><path d="M16 17.01V10h-2v7.01h-3L15 21l4-3.99h-3zM9 3 5 6.99h3V14h2V6.99h3L9 3z"/></svg></button>
  </div>
  <div class="modes"><div class="mode"><svg viewBox="0 0 24 24"><path d="M13.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM9.8 8.9 7 23h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3C14.8 12 16.8 13 19 13v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1L6 8.3V13h2V9.6l1.8-.7"/></svg><span id="modeT">Walk</span></div></div>
</div>

<div id="sheet"><div class="handle" id="handle"><i></i></div><button class="ib" id="sheetX" aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button><div id="sheetBody"></div></div>
<div id="leave"></div>

<div id="search">
  <div class="sHead">

const $=id=>document.getElementById(id);
const IC={

 star:'<svg viewBox="0 0 24 24"><path d="m22 9.24-7.19-.62L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21 12 17.27 18.18 21l-1.63-7.03L22 9.24zM12 15.4l-3.76 2.27 1-4.28-3.32-2.88 4.38-.38L12 6.1l1.71 4.04 4.38.38-3.32 2.88 1 4.28L12 15.4z"/></svg>',
 starOn:'<svg viewBox="0 0 24 24" style="color:#f9ab00"><path d="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>',
 share:'<svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg>',
 camera:'<svg viewBox="0 0 24 24"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4z"/><path d="M9 2 7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>',
 person:'<svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>',
 history:'<svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>',
};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const toast=(m)=>{const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2200)};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ---------------- data: booths + places ---------------- */
const booths=E.booths.map((b,k)=>({...b,k,img:b.poly.map(([x,y])=>[(x-X0)*PX,(y-Y0)*PX]),ic:[(b.c[0]-X0)*PX,(b.c[1]-Y0)*PX]}));
const byCode={};booths.forEach(b=>{if(b.code)byCode[b.code.toUpperCase()]=b});
booths.forEach(b=>{const m=String(b.name).match(/\((\w+)\)\s*$/);if(m&&!byCode[m[1].toUpperCase()])byCode[m[1].toUpperCase()]=b});
const key=s=>norm(s).replace(/[^a-z0-9]/g,'');
const featureKind=n=>{n=norm(n);if(/cafe|café/.test(n))return'cafe';if(/lounge|break|recharge|social/.test(n))return'lounge';if(/conference|forum|stage|theatre|theater/.test(n))return'talk';if(/registration|badge|service desk|lead retrieval|matchmaking|prep room/.test(n))return'service';return null};
let places=[];
// "endurosat" from "https://www.endurosat.com/", "leaf" from "leaf.space", "ohb" from "ohb.de"
function domLabel(u){try{if(!u)return'';const h=new URL(/^https?:/i.test(u)?u:'https://'+u).hostname.toLowerCase().replace(/^www\d?\./,'');const parts=h.split('.');let i=parts.length-2;if(i>0&&/^(co|com|org|ac|gov|net)$/.test(parts[i])&&parts[parts.length-1].length===2)i--;return parts[Math.max(0,i)]||''}catch(e){return''}}
function buildPlaces(){
  const EX=Array.isArray(window.EXH)?window.EXH:[];
  const used=new Set();places=[];
  for(const x of EX){
    const codes=String(x.b||'').toUpperCase().split(/[\s,;/&+]+/).filter(Boolean);
    let bs=codes.map(c=>byCode[c]).filter(Boolean);
    if(!bs.length){const nn=key(x.n);bs=booths.filter(b=>b.name&&key(b.name)===nn)}
    bs.forEach(b=>used.add(b.k));
    places.push({id:'e'+places.length,name:x.n,booth:bs[0]||null,booths:bs,codes,url:x.u||'',logo:/^https:\/\/cdn\.filestackcontent\.com\/\w+$/.test(x.l||'')?x.l:'',desc:x.d||'',prods:Array.isArray(x.p)?x.p:[],cats:(x.c||'').split('||').map(s=>s.trim()).filter(Boolean),country:x.k||'',kind:'ex'});
  }
  const exAt={};places.forEach(p=>p.booths.forEach(b=>(exAt[b.k]=exAt[b.k]||[]).push(key(p.name))));
  for(const b of booths){
    if(used.has(b.k)){const bn=key(b.name);if(!bn||(exAt[b.k]||[]).some(e=>e===bn||e.includes(bn)||bn.includes(e)))continue}
    const nm=b.name||('Booth '+b.code);
    places.push({id:'b'+b.k,name:nm,booth:b,booths:[b],codes:b.code?[b.code]:[],url:'',logo:'',desc:'',prods:[],cats:[],country:'',kind:featureKind(nm)||'booth'});
  }
  places.forEach(p=>{p.n=norm(p.name);p.dom=domLabel(p.url);p.k=key(p.name);p.cn=norm(p.cats.join(' '));p.hp=norm(p.prods.map(x=>x[0]+' '+(x[1]||'')).join(' | '));p.hd=norm(p.desc)});
  // per booth occupant list
  booths.forEach(b=>b.places=[]);
  places.forEach(p=>p.booths.forEach(b=>b.places.push(p)));
}
buildPlaces();
/* stars (kept on this phone; shareable as a link to back them up) */
const skey=p=>key(p.name)+(p.booth&&p.booth.code?'@'+p.booth.code:'');
let stars=new Set(store.get('stex-stars',[]));
const isStar=p=>stars.has(skey(p));
function setStar(p,on){const k=skey(p);on?stars.add(k):stars.delete(k);store.set('stex-stars',[...stars]);render()}
const starredPlaces=()=>places.filter(p=>p.booth&&isStar(p));
function placeLink(p){const b=p.booth;if(!b)return location.origin+location.pathname;const code=b.code||((b.name.match(/\((\w+)\)\s*$/)||[])[1])||'';const i=b.places.indexOf(p);return location.origin+location.pathname+'#'+encodeURIComponent(code)+(i>0?'.'+i:'')}
function starsLink(){const codes=starredPlaces().map(p=>{const i=p.booth.places.indexOf(p);return p.booth.code+(i>0?'.'+i:'')}).filter(Boolean);return location.origin+location.pathname+'#s:'+codes.join(',')}
function placeFromRef(ref){const [c,i]=String(ref).split('.');const b=byCode[decodeURIComponent(c).toUpperCase()];return b?(b.places[+i||0]||b.places[0]):null}
async function shareOrCopy(url,title,text){
  try{if(navigator.share){await navigator.share({title,text,url});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(url);toast('Link copied')}catch(e){toast(url)}
}
const hallName=h=>h==='4.1'?'Hall 4.1 (Upper Deck)':'Hall '+h;

/* ---------------- grid + pathfinding ---------------- */
const N=W*H, cell=new Uint16Array(N);
(()=>{const bin=atob(GR.rle);const u=new Uint16Array(bin.length/2);for(let i=0;i<u.length;i++)u[i]=bin.charCodeAt(2*i)|(bin.charCodeAt(2*i+1)<<8);let p=0;for(let i=0;i<u.length;i+=2){cell.fill(u[i],p,p+u[i+1]);p+=u[i+1]}})();
const boothCells=booths.map(()=>[]);
for(let i=0;i<N;i++){const v=cell[i];if(v>=1000)boothCells[v-1000].push(i)}
const PA=E.portal[0][1]*W+E.portal[0][0], PB=E.portal[1][1]*W+E.portal[1][0], PCOST=E.portalCost;
const COST=[Infinity,1,2,12];
const DX=[1,-1,0,0,1,1,-1,-1],DY=[0,0,1,-1,1,-1,1,-1],DL=[1,1,1,1,Math.SQRT2,Math.SQRT2,Math.SQRT2,Math.SQRT2];
const dist=new Float64Array(N), par=new Int32Array(N);
let fieldFor=-1, boothBest=new Int32Array(booths.length), boothLen=new Float32Array(booths.length);
// binary heap
let hk=new Float64Array(1<<16), hv=new Int32Array(1<<16), hn=0;
function hpush(k,v){if(hn>=hk.length){const a=new Float64Array(hk.length*2);a.set(hk);hk=a;const b=new Int32Array(hv.length*2);b.set(hv);hv=b}let i=hn++;while(i>0){const p=(i-1)>>1;if(hk[p]<=k)break;hk[i]=hk[p];hv[i]=hv[p];i=p}hk[i]=k;hv[i]=v}
function hpop(){const v=hv[0],k=hk[--hn],x=hv[hn];let i=0;for(;;){let c=2*i+1;if(c>=hn)break;if(c+1<hn&&hk[c+1]<hk[c])c++;if(hk[c]>=k)break;hk[i]=hk[c];hv[i]=hv[c];i=c}hk[i]=k;hv[i]=x;return v}
function field(origin){
  if(fieldFor===origin)return;
  dist.fill(Infinity);par.fill(-1);hn=0;
  const ob=1000+origin;
  for(const i of boothCells[origin]){dist[i]=0;hpush(0,i)}
  while(hn){
    const kd=hk[0], i=hpop(); if(kd>dist[i])continue;
    const x=i%W,y=(i-x)/W;
    for(let d=0;d<8;d++){
      const nx=x+DX[d],ny=y+DY[d];if(nx<0||ny<0||nx>=W||ny>=H)continue;
      const j=ny*W+nx,v=cell[j];
      const c=v>=1000?(v===ob?1:Infinity):COST[v];if(c===Infinity)continue;
      if(d>=4){const a=cell[y*W+nx],b=cell[ny*W+x];if((a===0||(a>=1000&&a!==ob))||(b===0||(b>=1000&&b!==ob)))continue}
      const nd=kd+DL[d]*c;if(nd<dist[j]){dist[j]=nd;par[j]=i;hpush(nd,j)}
    }
    if(i===PA||i===PB){const j=i===PA?PB:PA,nd=kd+PCOST;if(nd<dist[j]){dist[j]=nd;par[j]=i;hpush(nd,j)}}
  }
  // best approach cell per booth
  const bd=new Float32Array(booths.length).fill(Infinity);boothBest.fill(-1);
  for(let i=0;i<N;i++){
    const v=cell[i];if(v===0||v>=1000||dist[i]===Infinity)continue;
    const x=i%W;
    const ns=[x+1<W?i+1:-1,x>0?i-1:-1,i+W<N?i+W:-1,i-W>=0?i-W:-1];
    for(const j of ns){if(j<0)continue;const u=cell[j];if(u>=1000){const k=u-1000;if(dist[i]<bd[k]){bd[k]=dist[i];boothBest[k]=i}}}
  }
  // geometric length of each route (in grid cells)
  for(let k=0;k<booths.length;k++){
    if(k===origin){boothLen[k]=0;continue}
    let i=boothBest[k];if(i<0){boothLen[k]=Infinity;continue}
    let L=0;
    while(par[i]>=0){const p=par[i];if((i===PA&&p===PB)||(i===PB&&p===PA))L+=PCOST;else{const dx=Math.abs(i%W-p%W),dy=Math.abs(((i/W)|0)-((p/W)|0));L+=(dx&&dy)?Math.SQRT2:1}i=p}
    boothLen[k]=L*0.93;   // grid paths zig-zag a little; trims to the straightened length
  }
  fieldFor=origin;
}
const metres=k=>boothLen[k]/S*M_PER_PT;
const mins=m=>m/WALK/60;
function fmtMin(m){const t=mins(m);return t<0.75?'<1 min':Math.round(t)+' min'}
function fmtDist(m){return m<1000?(Math.round(m/10)*10||10)+' m':(m/1000).toFixed(1)+' km'}

function passable(i,o,dk){const v=cell[i];return v===1||v===2||v===1000+o||v===1000+dk}
function los(a,b,o,dk){
  const ax=a%W,ay=(a/W)|0,bx=b%W,by=(b/W)|0;const n=Math.ceil(Math.max(Math.abs(bx-ax),Math.abs(by-ay))*2);
  for(let s=0;s<=n;s++){const x=Math.round(ax+(bx-ax)*s/n),y=Math.round(ay+(by-ay)*s/n);if(!passable(y*W+x,o,dk))return false}
  return true;
}
function route(o,dk){
  field(o);
  let i=boothBest[dk];if(i<0)return null;
  const raw=[];while(i>=0){raw.push(i);i=par[i]}raw.reverse();
  // split at the stairs
  const segs=[[]];

function termRe(t){return new RegExp('(^|[^a-z0-9])'+reEsc(t)+(t.length<=4?'s?(?![a-z])':''))}
function topicGroups(q){
  if(SYN[q])return[SYN[q].map(termRe)];
  return q.split(/\s+/).filter(w=>w.length>=2).map(w=>(SYN[w]||[w]).map(termRe));
}
function topicMatch(p,groups){
  if(!groups.length)return null;let sc=0,why=null;
  for(const g of groups){
    let f=null;
    if(g.some(r=>r.test(p.hp)))f='p';else if(g.some(r=>r.test(p.n)))f='n';else if(g.some(r=>r.test(p.cn)))f='c';else if(g.some(r=>r.test(p.hd)))f='d';
    if(!f)return null;sc+=f==='p'?120:f==='n'?100:f==='c'?70:50;
    {const hs=[p.hp,p.n,p.cn,p.hd];const idx=g.findIndex(r=>hs.some(h=>r.test(h)));sc+=Math.max(0,30-8*idx)}   // the word typed beats a related word
    if(!why){
      if(f==='p'){const pr=p.prods.find(x=>g.some(r=>r.test(norm(x[0]+' '+(x[1]||'')))));if(pr)why='Product: '+pr[0]}
      else if(f==='c'){const c=p.cats.find(x=>g.some(r=>r.test(norm(x))));if(c)why='Category: '+c}
      else if(f==='d'){const r=g.find(r=>r.test(p.hd));const m=r&&r.exec(p.hd);if(m){const i=m.index;const a=Math.max(0,i-40),b=Math.min(p.desc.length,i+70);why=(a?'…':'')+p.desc.slice(a,b).trim()+(b<p.desc.length?'…':'')}}
    }
  }
  return{sc,why};
}
let lastTopic=null;
function score(p,q,words){
  if(!q)return 0;let s=0;
  const codeHit=p.codes.some(c=>norm(c)===q);if(codeHit)s+=1000;
  if(p.n===q)s+=900;else if(p.n.startsWith(q))s+=600;
  else if(words.every(w=>p.n.split(/[^a-z0-9]+/).some(t=>t.startsWith(w))))s+=400;
  else if(p.n.includes(q))s+=250;
  else if(p.codes.some(c=>norm(c).startsWith(q)))s+=200;
  else if(words.every(w=>p.cn.includes(w)||p.n.includes(w)))s+=60;
  else if(q.length>=4&&norm(p.desc).includes(q))s+=20;
  return s;
}

function renderResults(raw){

function catFromLabel(t){t=norm(t);if(/setup|set up/.test(t))return'setup';if(/booth/.test(t))return'booth';if(/round/.test(t))return'roam';if(/break|lunch/.test(t))return'brk';if(/prep|debrief/.test(t))return'prep';if(/meeting/.test(t))return'meet';if(/event/.test(t))return'event';return null}

function catFromColor(c,legend,text){
  c=(c||'').toLowerCase();
  if(!c||c==='#ffffff')return text?'other':'free';
  if(legend[c])return legend[c];
  const x=hexHsl(c);if(!x)return'other';
  if(x.s<0.08)return /^n\/?a$/i.test(text.trim())?'na':(text?'other':'na');
  if(x.h>=75&&x.h<=165)return'booth';            // green
  if(x.h>=240&&x.h<=320)return'roam';            // purple
  if(x.h>=20&&x.h<=60&&x.l>=0.8)return'brk';     // skin / peach / cream
  if(x.h>=20&&x.h<=45)return'meet';

function parseGrid(html){

function buildBlocks(day,legend){

async function loadRoster(force){

  for(const m of t.toUpperCase().matchAll(/\b([A-Z]{1,3}\d{1,3}|\d{4})\b/g)){const c=m[1];if(/^H[1-7]$/.test(c))continue;const bo=byCode[c];if(bo&&bo.places[0])return{places:[bo.places[0]],label:(bo.code?'Booth '+bo.code+', ':'')+hallName(bo.hall)}}

  if(S.busy)h+=`<div class="scanbox">${S.thumb?`<img src="${S.thumb}" alt="">`:''}<div><div class="nt">Reading the card…</div><div class="muted" id="scProg">${esc(S.prog||'Starting')}</div></div></div>`;
  else if(S.text){
    h+=S.matches.length?`<div class="hdr" style="padding:8px 0 4px">${S.matches.length===1?'Match':'Possible matches'}</div>`+S.matches.map((m,i)=>`<div class="res scm" data-id="${m.p.id}"><div class="ric">${m.p.logo?`<span class="ini">${esc(initials(m.p.name))}</span><img src="${esc(m.p.logo)}" alt="" onerror="this.remove()">`:placeIcon(m.p)}</div><div class="rt"><div class="rn">${isStar(m.p)?'<span class="rstar">★</span>':''}${esc(m.p.name)}</div><div class="rs">${m.p.booth?(m.p.booth.code?'Booth '+esc(m.p.booth.code)+' · ':'')+hallName(m.p.booth.hall):'Not on plan'} · ${esc(m.why)}</div></div><button class="btn sm${isStar(m.p)?'':' pri'}" data-star="${m.p.id}">${isStar(m.p)?'Starred':'★ Star'}</button></div>`).join('')
      :`<div class="nowc" style="cursor:default"><div class="nt">No exhibitor matched</div><div class="muted">The company may not be exhibiting, or the photo was hard to read. Try again closer and flatter, or search by name.</div></div>`;
    h+=`<details class="scantxt"><summary>Text read from the card</summary><pre>${esc(S.text)}</pre><button class="btn sm" id="scCopy">${IC.copy}Copy text</button></details>`;
  }
  setSheet(h,keep?{keepScroll:true}:{expand:true});
  $('scCam').onclick=()=>$('camIn').click();$('scPic').onclick=()=>$('picIn').click();
  body.querySelectorAll('.scm').forEach(el=>el.onclick=()=>openPlace(places.find(p=>p.id===el.dataset.id)));
  body.querySelectorAll('[data-star]').forEach(el=>el.onclick=e=>{e.stopPropagation();const p=places.find(x=>x.id===el.dataset.star);setStar(p,!isStar(p));openScan(true)});
  if($('scCopy'))$('scCopy').onclick=()=>{try{navigator.clipboard.writeText(S.text).then(()=>toast('Copied'))}catch(e){}};
  render();
}
let tessP=null;
function loadTess(){if(window.Tesseract)return Promise.resolve();if(tessP)return tessP;tessP=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';sc.onload=res;sc.onerror=()=>{tessP=null;rej(new Error('Could not load the text reader (needs signal the first time)'))};document.head.appendChild(sc)});return tessP}
async function imgToCanvas(file){
  const url=URL.createObjectURL(file);
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
  const sc=Math.min(1,1800/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
  const g=c.getContext('2d');g.drawImage(img,0,0,c.width,c.height);
  // greyscale + stretch contrast helps OCR on glossy cards
  const d=g.getImageData(0,0,c.width,c.height),a=d.data;let mn=255,mx=0;
  for(let i=0;i<a.length;i+=4){const v=0.299*a[i]+0.587*a[i+1]+0.114*a[i+2];a[i]=v;if(v<mn)mn=v;if(v>mx)mx=v}
  const r=Math.max(1,mx-mn);for(let i=0;i<a.length;i+=4){const v=(a[i]-mn)*255/r;a[i]=a[i+1]=a[i+2]=v}
  g.putImageData(d,0,0);
  const t=document.createElement('canvas');const ts=160/Math.max(c.width,c.height);t.width=c.width*ts;t.height=c.height*ts;t.getContext('2d').drawImage(img,0,0,t.width,t.height);
  URL.revokeObjectURL(url);return{c,thumb:t.toDataURL('image/jpeg',0.7)};
}
const GENERIC=/^(gmbh|ag|se|sa|sas|srl|spa|bv|nv|ltd|limited|inc|llc|plc|kg|co|oy|ab|as|aps|sp|zoo|the|and|of|de|der|und|space|systems?|technolog(y|ies)|group|international|engineering|solutions|aerospace|europe|industries|electronics|company|services|satellite|defen[cs]e|research|centre|center|institute|university|gmbh)$/;
function nameToks(p){if(!p._nt)p._nt=norm(p.name).split(/[^a-z0-9]+/).filter(w=>w.length>=3&&!GENERIC.test(w));return p._nt}
function matchCard(text){
  const low=text.toLowerCase();const k=key(text);const found=new Map();
  const lines=text.split(/\n+/).map(l=>new Set(norm(l).split(/[^a-z0-9]+/).filter(Boolean)));
  const add=(p,sc,why)=>{const o=found.get(p);if(!o||o.sc<sc)found.set(p,{p,sc,why})};
  // email and web addresses
  const doms=new Set();
  for(const m of low.matchAll(/[a-z0-9._%+-]+@([a-z0-9-]+(?:\.[a-z0-9-]+)+)/g))doms.add(domLabel(m[1]));
  for(const m of low.matchAll(/(?:https?:\/\/|www\.)([a-z0-9-]+(?:\.[a-z0-9-]+)+)/g))doms.add(domLabel(m[1]));
  for(const m of low.matchAll(/\b([a-z0-9-]{3,}\.(?:com|de|eu|space|io|net|org|fr|it|es|nl|ch|at|se|no|fi|dk|be|pl|cz|lu|pt|gr|ie|us|ca|jp|kr|au|in|tech|aero|ai|co\.uk|uk|bg|ee|lt|lv|ro|hu|sk|si|il))\b/g))doms.add(domLabel(m[1]));
  doms.delete('');
  for(const p of places){if(p.kind!=='ex')continue;
    if(p.dom&&p.dom.length>=3&&doms.has(p.dom))add(p,100,'matched '+p.dom+' address');
    if(p.k.length>=5&&k.includes(p.k))add(p,60+Math.min(30,p.k.length),'name on card');
    else{const t=nameToks(p);if(t.length&&lines.some(L=>t.every(w=>L.has(w))))add(p,45+10*t.length,'name on card')}
  }
  return [...found.values()].sort((a,b)=>b.sc-a.sc).slice(0,5);
}
async function runScan(file){
  if(!file)return;const S=scanState;S.busy=true;S.text='';S.matches=[];S.prog='Preparing photo';
  try{
    const {c,thumb}=await imgToCanvas(file);S.thumb=thumb;openScan(state.mode==='scan');
    let text;
    if(window.__fakeOCR)text=window.__fakeOCR;
    else{await loadTess();S.prog='Loading text reader';if($('scProg'))$('scProg').textContent=S.prog;
      const r=await Tesseract.recognize(c,'eng',{logger:m=>{if(m.status){S.prog=m.status.replace(/^./,x=>x.toUpperCase())+(m.progress?' '+Math.round(m.progress*100)+'%':'');const el=$('scProg');if(el)el.textContent=S.prog}}});
      text=r.data.text}
    S.text=(text||'').trim()||'(no text found)';S.matches=matchCard(S.text);
  }catch(e){S.text='';toast(e.message||'Could not read that photo')}
  S.busy=false;
  if(state.mode==='scan'){overlay={sel:null,route:null,from:state.from,multi:S.matches.filter(m=>m.p.booth).map(m=>m.p)};openScan(true)}
  if(S.matches.length===1&&S.matches[0].sc>=60)toast('Found '+S.matches[0].p.name);
}
$('camIn').onchange=e=>{const f=e.target.files[0];e.target.value='';runScan(f)};
$('picIn').onchange=e=>{const f=e.target.files[0];e.target.value='';runScan(f)};

/* links: #J28 opens a booth, #s:J28,C42 adds starred booths */
function handleHash(){
  const h=decodeURIComponent(location.hash.slice(1));if(!h)return;
  try{history.replaceState(history.state,'',location.pathname)}catch(e){}
  if(h.startsWith('s:')){const ps=h.slice(2).split(',').map(placeFromRef).filter(Boolean);let n=0;ps.forEach(p=>{if(!isStar(p)){stars.add(skey(p));n++}});store.set('stex-stars',[...stars]);toast(n?'Added '+n+' starred booth'+(n>1?'s':''):'Those booths were already starred');if(ps.length)openStarred();return}
  const p=placeFromRef(h);if(p)openPlace(p);else toast('Booth '+h+' not found');
}
window.addEventListener('hashchange',handleHash);
/* offline: cache the app so it opens without signal (roster falls back to the last copy) */
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
/* ---------------- boot ---------------- */
function boot(){
  minS=Math.min(vw()/IMW,vh()/IMH)*0.9;
  layoutLabels();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{layoutLabels();render()});
  try{history.replaceState({stex:0},'')}catch(e){}
  applyRot();
  explore();fitAll(false);
  loadRoster();
  setTimeout(()=>{field(home.booth.k);$('loading').remove();
    handleHash();
  },30);
}
const img=$('mapimg');if(img.complete)boot();else{img.onload=boot;img.onerror=boot}
})();
